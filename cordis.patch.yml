# dsh-ralph-loop bundle patch: inserts the RALPH loop plugin into any profile
# that lists this package in `dsh.profile.bundles`. The plugin needs the
# harness core services (llm, tools, subprocess, sandbox).
# The host profile must mount a Sandbox provider (normally the base bundle);
# this patch inserts Ralph only and does not ship dsh-sandbox-local itself.
# Missing/unavailable Sandbox, or confined.enforcement=partial, is fail-closed:
# Ralph refuses to run the test command and never falls back to the raw argv.
- insert:
    - id: ralph-loop
      name: 'dsh-ralph-loop'
      config:
        # Hard upper bound on plan→test cycles per execution; the loop stops
        # and reports accumulated lessons once reached.
        maxCycles: 5
        # Run the LLM reflection node on test failure (false = deterministic
        # stderr excerpt, no model call).
        autoReflectOnFailure: true
        # Emit per-phase log lines through the harness logger.
        verboseLogging: false
        # LLM route for the RALPH nodes. Required at execution time; may be
        # overridden per tool call.
        provider: ''
        model: ''
        # Handle 节点代码生成的 maxTokens 硬上限；0 = 不设（provider 默认）。
        codegenMaxTokens: 0
        # Per-test-command deadline in ms.
        testTimeoutMs: 120000
        # Total wall-clock budget for one full loop in ms (30min default).
        # The internal AbortSignal actively cancels in-flight LLM/subprocess
        # work (for adapters that honor it) and returns timedOut=true; a
        # caller AbortSignal keeps its original cancellation and emits no
        # normal ralph/end event.
        totalTimeoutMs: 1800000
